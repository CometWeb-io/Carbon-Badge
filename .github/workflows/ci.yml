name: carbon-badge CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Dependency security gate
        run: npm run security:audit
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck tests and E2E
        run: npm run typecheck:test
      - name: Unit tests with coverage gate
        run: npm run test:coverage
      - name: Production build
        run: npm run clean && NODE_ENV=production npm run build
      - name: Bundle size budget
        run: npm run size:check
      - name: Pack integrity
        run: npm pack --dry-run
      - name: Package consumer smoke
        run: npm run pack:consumer
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser E2E
        run: npm run test:e2e
