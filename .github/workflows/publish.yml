name: Publish package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Verify tag matches package
        run: node scripts/verify-release.mjs
      - name: Require commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci
      - run: npm run security:audit
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm run test:coverage
      - run: npm run clean && NODE_ENV=production npm run build
      - run: npm run size:check
      - run: npm run sri
      - run: npm run pack:consumer
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Upload release artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carbon-badge-${{ github.ref_name }}
          path: |
            dist/cometweb-carbon-badge.esm.js
            dist/cometweb-carbon-badge.umd.js
            dist/release-manifest.json
      - run: npm publish --access public --provenance
