name: Publish package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Verify tag matches package
        run: node scripts/verify-release.mjs
      - name: Require commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci
      - run: npm run security:audit
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm run test:coverage
      - run: npm run clean && NODE_ENV=production npm run build
      - run: npm run size:check
      - run: NODE_ENV=production npm run sri
      - run: npm run pack:consumer
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Require successful marketing integration on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          BADGE_MARKETING_ORIGIN: ${{ vars.BADGE_MARKETING_ORIGIN }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/marketing-gate.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          test -n "$run_id"
          gh run download "$run_id" --name "marketing-integration-$GITHUB_SHA" --dir marketing-gate
          node scripts/verify-marketing-gate.mjs marketing-gate/marketing-receipt.json
      - name: Upload release artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carbon-badge-${{ github.ref_name }}
          path: |
            dist/**
      - run: npm publish --access public --provenance
