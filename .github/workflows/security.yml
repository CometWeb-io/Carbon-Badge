name: carbon-badge security

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p artifacts
          npm --silent run sbom > artifacts/carbon-badge-sbom.cdx.json
      - uses: actions/upload-artifact@v6
        with:
          name: carbon-badge-sbom-${{ github.sha }}
          path: artifacts/carbon-badge-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  provenance:
    name: Package provenance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run clean && NODE_ENV=production npm run build
      - name: Prepare package and SBOM
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          npm --silent run sbom > artifacts/carbon-badge-sbom.cdx.json
      - uses: actions/upload-artifact@v6
        with:
          name: carbon-badge-package-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14
      - uses: actions/attest@v4
        with:
          subject-path: artifacts/*.tgz
          sbom-path: artifacts/carbon-badge-sbom.cdx.json
